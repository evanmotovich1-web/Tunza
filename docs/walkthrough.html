  footer.phone-foot { padding: 0.5rem 1.25rem 1.5rem; }

  .stack5 { display: flex; flex-direction: column; gap: 1.25rem; }
  .stack4 { display: flex; flex-direction: column; gap: 1rem; }
  .stack3 { display: flex; flex-direction: column; gap: 0.75rem; }
  .stack2 { display: flex; flex-direction: column; gap: 0.5rem; }

  .status-line { font-size: 1rem; line-height: 1.5rem; font-weight: 600; }

    display: block; width: 100%;

  .choice:hover { border-color: rgba(28,25,22,0.3); }

    min-height: 3.5rem; border-radius: var(--radius);

  .tone-redirected, .tone-watch_sign { background: var(--watch-soft); color: var(--watch); }

  .demo-paper { border-radius: var(--radius); background: var(--paper); padding: 0.75rem; color: var(--ink); }

    text-decoration: underline; text-underline-offset: 2px; min-height: 2rem;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const DEMO_ACCESS = { chp:"CHP-DEMO", facility:"FACILITY-DEMO" };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const p = JSON.parse(raw); if (p && p.role && p.encounter) state = { ...state, ...p, view: p.view || "home", grants: { chp: !!(p.grants && p.grants.chp), facility: !!(p.grants && p.grants.facility) }, gateRole: null }; }

state.role = "household";

/* ---------- actions ---------- */
const act = {
  setRole(role) {
    // Gated surfaces open only for granted roles; everyone else gets the gate.
    if (role !== "household" && !state.grants[role]) {
      state.role = "household"; state.view = "gate"; state.gateRole = role;
      ui.gateCode = ""; ui.gateStatus = "idle";
      render(); return;
    }
    state.role = role; render();
  },
  setLocale(l) { state.locale = l; document.documentElement.lang = l; render(); },
  setView(v) { state.view = v; render(); },
  toggleFailure(f) {
    const has = state.injectedFailures.includes(f);
    state.injectedFailures = has ? state.injectedFailures.filter(x => x !== f) : [...state.injectedFailures, f];
    const r = state.referral;
    if (f === "no_facility_response" && !has && r && r.stage === "sent") state.referral = { ...r, failure:"no_facility_response" };
    if (f === "no_facility_response" && has && r && r.failure === "no_facility_response") state.referral = { ...r, failure:null };
    if (f === "redirected" && !has && r) state.referral = applyReferralAction(r, "redirect", {});
    render();
  },
  answer(q, v) {
    const e = state.encounter; if (!e || e.currentQuestion !== q) return;
    const answers = applyAnswer(e.answers, q, v);

  },

    if (!d || state.referral || (d.kind !== "go_now" && d.kind !== "get_care_today")) return;
    state.referral = createReferral(d.kind === "go_now");
    render();

let recognition = null;
function toggleSpeak() {
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) { ui.speakMessage = t("speakUnavailable"); ui.entryMode = "type"; render(); return; }
  if (ui.listening) {
    ui.stopRequested = true;
    try { recognition && recognition.stop(); } catch (e) {}
    ui.listening = false; render(); return;
  }
  try {
    recognition = new Ctor();
    recognition.lang = state.locale === "sw" ? "sw-KE" : "en-KE";
    recognition.interimResults = false; recognition.continuous = false;
    ui.stopRequested = false;
    let gotText = false;
    recognition.onresult = (ev) => {
      const text = ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript;
      if (text && state.encounter) {
        gotText = true;
        const cur = state.encounter.answers.presentation;
        state.encounter.answers.presentation = cur ? cur + " " + text : text;
      }
    };
    // Ending with nothing captured (and not stopped by the user) is a failure:
    // say so where the person will see it, and hand them the keyboard.
    recognition.onend = () => {
      ui.listening = false;
      if (!gotText && !ui.stopRequested) {
        ui.speakMessage = t("speakUnavailable");

      render();
    };
    recognition.onerror = () => {
      ui.listening = false;
      ui.speakMessage = t("speakUnavailable");
      ui.entryMode = "type";
      render();
    };
    ui.speakMessage = null; ui.listening = true; recognition.start(); render();
  } catch (e) { ui.listening = false; ui.speakMessage = t("speakUnavailable"); render(); }
}

    <section class="stack5">
      <header class="stack2">
        <h1 class="q">${esc(content.question)}</h1>
        ${content.hint ? `<p class="body soft">${esc(content.hint)}</p>` : ""}
      </header>
      ${entry}
      ${content.choices.length ? `<div class="stack2" role="group" aria-label="${esc(content.question)}">
        ${content.choices.map(c => `<button class="choice" data-answer="${c.id}">${esc(c.label)}</button>`).join("")}
      </div>` : ""}
      <button class="dont-know" data-act="dont-know">${esc(q === "who" ? t("whoUnknown") : t("dontKnow"))}</button>
    </section>
  </div>`;
}
function decisionHtml(forChp) {
  const e = state.encounter; const d = e && e.decision; if (!d) return "";
  const fails = activeFailures();
  const askedMain = e.asked.includes("main_problem");
  let action = null;
  if (d.kind === "go_now" || d.kind === "get_care_today")
    action = { act:"prepare", label: forChp ? t("createReferral") : t("prepareFacility") };
  else if (d.kind === "need_one_more_answer" && !askedMain)
    action = { act:"one-more", label: t("answerTheQuestion") };
  const why = d.reasonKeys.map(k => t(k));
  const inner = `
    ${fails.includes("incomplete_assessment") ? warningHtml("incomplete_assessment") : ""}
    ${!forChp && fails.includes("offline") ? warningHtml("offline") : ""}
    ${!forChp && d.dangerSignKeys.length ? warningHtml("danger_sign", d.dangerSignKeys.map(k => t(k)).join(" · ")) : ""}
    ${!forChp && d.kind === "monitor_at_home" ? warningHtml("watch_sign", d.watchSignKeys.map(k => t(k)).join(" · ")) : ""}`;
  return `<section class="stack5">
    <header class="stack3">
      <p class="eyebrow">${esc(t("nextAction"))}</p>
      <h1 class="verdict ${d.kind}">${esc(decisionHeadline(d.kind))}</h1>
      <p class="status-line">${esc(decisionStatus(d.kind))}</p>
    </header>
    ${action ? `<button class="primary" data-act="${action.act}">${esc(action.label)}</button>` : ""}
    ${inner}
    ${why.length ? disclosure("whyOpen", t("whyThis"), `<ul class="plain" style="gap:0.5rem; margin-top:0">${why.map(r => `<li class="label soft">${esc(r)}</li>`).join("")}</ul>`) : ""}
  </section>`;
}
function carePathHtml(role) {
  const r = state.referral; const e = state.encounter; if (!r || !e) return "";
  const kind = e.decision ? e.decision.kind : null;
  const view = describeReferral(role, r, kind);
  const fails = activeFailures();
  const missing = missingInfo(e.answers, r.askMore);
  const followUps = followUpItems(role, r, kind);
  const showArrivalInHeadline = role === "facility" && r.stage === "accepted" && view.arrivalMinutes !== null;
  const headline = `${esc(view.headline)}${showArrivalInHeadline ? ` — ${tplNum(t("expectedArrivalTpl"), view.arrivalMinutes)}` : ""}`;
  const travel = view.arrivalMinutes !== null && !showArrivalInHeadline
    ? `<p class="body w600 soft">${tplNum(t("travelTpl"), view.arrivalMinutes)}</p>` : "";
  const actionBtn = view.action ? `<button class="primary" data-act="ref:${view.action.id}">${esc(view.action.label)}</button>` : "";
  const secondary = role === "facility" && (r.stage === "sent" || r.stage === "received")
    ? disclosure("otherOpen", t("otherActions"),
        `<button class="secondary-btn" data-act="ref:redirect">${esc(t("redirect"))}</button>
         <button class="secondary-btn" data-act="ref:ask_more">${esc(t("askMore"))}</button>`)
    : "";
  const statusBlock = `<section class="stack5" aria-live="polite">
    <header class="stack3">
      <p class="eyebrow">${esc(t("referralEyebrow"))} · ${esc(view.stageLabel)}</p>
      <h1 class="verdict" style="color:var(--ink)">${headline}</h1>
      <p class="status-line">${esc(view.status)}</p>
      ${travel}
    </header>
    ${actionBtn}
    ${fails.map(n => warningHtml(n)).join("")}
  </section>`;
  if (role === "facility") {
    return `<div class="stack4">${statusBlock}${handoffHtml(kind)}${facilityCardHtml(role, kind)}${secondary}
      ${missing.length ? attentionHtml(t("missingInformation"), missing) : ""}</div>`;
  }
  if (role === "chp") {
    return `<div class="stack4">${statusBlock}
      ${attentionHtml(t("needsAction"), [...followUps, ...missing], followUps.length === 0 && missing.length === 0 ? t("nothingWaiting") : null)}
      ${facilityCardHtml(role, kind)}
      ${disclosure("moreOpen", t("moreDetail"), handoffHtml(kind))}</div>`;
  }
  return `<div class="stack4">${statusBlock}${facilityCardHtml(role, kind)}
    ${disclosure("moreOpen", t("moreDetail"), handoffHtml(kind))}</div>`;
}
function homeHtml() {
  const e = state.encounter; const r = state.referral;
  const continueDetail = r
    ? `${t("referralEyebrow")} · ${t(STAGE_LABEL[r.stage])}`
    : e && e.decision
      ? decisionHeadline(e.decision.kind)
      : e && e.asked.length > 0
        ? t("homeCardAssessTitle")
        : null;
  return `<section class="home">
    <h1 class="home-title">Tunza</h1>
    <p class="home-tagline">${esc(t("homeTagline"))}</p>
    <button class="home-cta" data-act="view-path">${esc(t("homeGetStarted"))}</button>
    <div class="home-cards">
      <button class="home-card" data-act="view-path">
        <p class="ct">${esc(t("homeCardAssessTitle"))}</p>
        <p class="cd">${esc(t("homeCardAssessDesc"))}</p>
      </button>
      <button class="home-card" data-act="view-nearby">
        <p class="ct">${esc(t("homeCardNearbyTitle"))}</p>
        <p class="cd">${esc(t("homeCardNearbyDesc"))}</p>
      </button>
      ${continueDetail ? `<button class="home-card wide" data-act="view-path">
        <p class="ct">${esc(t("homeCardContinueTitle"))}</p>
        <p class="cd">${esc(continueDetail)}</p>
      </button>` : ""}
    </div>
    <p class="home-mission">${esc(t("homeMission"))}</p>
    <button class="home-link" data-act="view-gate">${esc(t("homeHealthWorker"))}</button>
  </section>`;
}
function gateHtml() {
  const chosen = state.gateRole;
  const choice = (role, key) => `<button class="choice" data-act="gate-choose:${role}" aria-pressed="${chosen === role}" style="${chosen === role ? "border-color:var(--action)" : ""}">${esc(t(key))}</button>`;
  return `<div class="stack4">
    <button class="back-btn" data-act="view-home">${esc(t("back"))}</button>
    <section class="stack5">
      <header class="stack2">
        <h1 class="q">${esc(t("gateHeading"))}</h1>
        <p class="body soft">${esc(t("gateBody"))}</p>
      </header>
      <div class="stack2" role="group" aria-label="${esc(t("gateHeading"))}">
        ${choice("chp", "gateChooseChp")}
        ${choice("facility", "gateChooseFacility")}
      </div>
      ${chosen ? `<div class="stack3">
        <label class="stack2"><span class="field-label">${esc(t("gateCodeLabel"))}</span>
          <input type="text" class="gate-input" autocapitalize="characters" autocomplete="off" value="${esc(ui.gateCode)}" data-input="gate-code"></label>
        ${ui.gateStatus === "error" ? `<p class="label w500" style="color:var(--urgent)" role="alert">${esc(t("gateWrongCode"))}</p>` : ""}
        <button class="primary" data-act="gate-submit">${esc(t("gateSubmit"))}</button>
      </div>` : ""}
      <p class="caption soft">${esc(t("gateDemoHint"))}</p>
    </section>
  </div>`;
}
function nearbyHtml() {
  return `<div class="stack4">
    <button class="back-btn" data-act="view-home">${esc(t("back"))}</button>
    <h1 class="q">${esc(t("nearbyTitle"))}</h1>
    <p class="label soft">${esc(t("nearbyDemoFallback"))}</p>
    ${FACILITIES.map(f => `<article class="card">
      <p class="eyebrow">${esc(t("facilityEyebrow"))}</p>
      <h2 class="heading w600" style="margin-top:0.25rem">${esc(f.name)}</h2>
      <p class="body w500 soft" style="margin-top:0.5rem">${tplNum(t("facilityTravelTpl"), f.travelMinutes)}</p>
      <p class="body w600" style="margin-top:0.5rem">${esc(f.canHandleUrgent ? t("facilityUrgentCapable") : t("facilityGeneralCare"))}</p>
      <p class="label soft" style="margin-top:0.5rem">${esc(f.services.join(" · "))}</p>
    </article>`).join("")}
  </div>`;
}
function surfaceHtml() {
  const e = state.encounter; const r = state.referral;
  if (state.role === "household" && state.view === "home") return homeHtml();
  if (state.role === "household" && state.view === "nearby") return nearbyHtml();
  if (state.role === "household" && state.view === "gate") return gateHtml();
  if (state.role === "facility") {
    if (!r) return attentionHtml(t("incomingTitle"), [{ id:"none", label:t("noIncoming"), detail:t("noIncomingDetail") }], null);
    if (r.stage === "completed" && !r.outcome) {
      const opts = [["treated","outcomeTreated"],["referred_onward","outcomeHigher"],["did_not_arrive","outcomeNoShow"]];
      return `<section class="stack5">
        <h1 class="q">${esc(t("outcomeQuestion"))}</h1>
        <div class="stack2">${opts.map(([id, k]) => `<button class="choice" data-act="outcome:${id}">${esc(t(k))}</button>`).join("")}</div>
        <button class="dont-know" data-act="outcome:unknown">${esc(t("dontKnow"))}</button>
      </section>`;
    }
    return carePathHtml("facility");
  }
  if (state.role === "chp") {
    if (!e) return attentionHtml(t("encounterTitle"), [{ id:"none", label:t("noEncounter"), detail:t("noEncounterDetail") }], null, { act:"reset", label:t("startEncounter") });
    if (r) return carePathHtml("chp");
    if (e.decision && !e.currentQuestion) {
      const missing = missingInfo(e.answers, null);
      const followUps = followUpItems("chp", null, e.decision.kind);
      return `<div class="stack4">${decisionHtml(true)}
        ${attentionHtml(t("missingInformation"), missing)}
        ${attentionHtml(t("whoNeedsFollowUp"), followUps)}</div>`;
    }
    const missing = missingInfo(e.answers, null);
    return `<div class="stack4">${assessmentFlowHtml()}
      ${e.asked.length ? disclosure("missingOpen", t("missingInformation"), attentionHtml(null, missing)) : ""}</div>`;
  }
  if (r && e) return carePathHtml("household");
  if (e && e.decision && !e.currentQuestion) return decisionHtml(false);
  return assessmentFlowHtml();
}
function chromeHtml() {
  const roles = [["household","roleHousehold"],["chp","roleChp"],["facility","roleFacility"]];
  const roleLabel = t(roles.find(x => x[0] === state.role)[1]);
  return `<header class="chrome">
    <div class="chrome-row">
      <button class="wordmark" data-act="go-home">Tunza</button>
      <div class="chrome-side">
        <p class="label w500 soft">${esc(t("viewingAs"))} ${esc(roleLabel)}</p>
        <button class="lang-btn" data-act="lang">${esc(t("languageButton"))}</button>
      </div>
    </div>
    <button class="demo-summary ${ui.demoOpen ? "open" : ""}" data-ui="demoOpen" aria-expanded="${ui.demoOpen}">${esc(t("demoLabel"))}</button>
    ${ui.demoOpen ? (() => {
      const panel = `<div class="demo-panel">
      <p class="eyebrow">${esc(t("namedConditions"))}</p>
      <div class="stack2" style="gap:0.25rem">
        ${FAILURES.map(f => {
          const active = f === "offline" ? isOffline() : state.injectedFailures.includes(f);
          return `<label class="check-row"><input type="checkbox" data-failure="${f}" ${active ? "checked" : ""}><span class="w500">${esc(warningCopy(f).title)}</span></label>`;
        }).join("")}
      </div>
      <button class="link-btn" data-act="reset">${esc(t("startOver"))}</button>
    </div>`;
      const onBrand = state.role === "household" && state.view === "home";
      return onBrand ? `<div class="demo-paper">${panel}</div>` : panel;
    })() : ""}
  </header>`;
}
function render() {
  persist();
  const onBrand = state.role === "household" && state.view === "home";
  document.querySelector(".stage").classList.toggle("on-brand", onBrand);
  document.getElementById("phone").classList.toggle("on-brand", onBrand);
  document.getElementById("phone").innerHTML = `
    ${chromeHtml()}
    <main>${surfaceHtml()}</main>
    <footer class="phone-foot"><p>${esc(t("disclaimer"))}</p></footer>`;
}

/* ---------- events ---------- */
document.getElementById("phone").addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-ui],[data-act],[data-answer],[data-role],[data-mode]");
  if (!el) return;
  if (el.dataset.ui) { ui[el.dataset.ui] = !ui[el.dataset.ui]; render(); return; }
  if (el.dataset.role) { act.setRole(el.dataset.role); return; }
  if (el.dataset.mode) { ui.entryMode = el.dataset.mode; render(); return; }
  if (el.dataset.answer) { act.answer(state.encounter.currentQuestion, el.dataset.answer); return; }
  const a = el.dataset.act;
  if (!a) return;
  if (a === "lang") act.setLocale(state.locale === "en" ? "sw" : "en");
  else if (a === "go-home") { state.role = "household"; state.view = "home"; render(); }
  else if (a === "view-home") act.setView("home");
  else if (a === "view-path") act.setView("path");
  else if (a === "view-nearby") act.setView("nearby");
  else if (a === "view-gate") { state.gateRole = null; ui.gateCode = ""; ui.gateStatus = "idle"; act.setView("gate"); }
  else if (a.startsWith("gate-choose:")) {
    const role = a.slice(12);
    if (state.grants[role]) { act.setRole(role); }
    else { state.gateRole = role; ui.gateCode = ""; ui.gateStatus = "idle"; render(); }
  }
  else if (a === "gate-submit") {
    const role = state.gateRole;
    if (role && ui.gateCode.trim().toUpperCase() === DEMO_ACCESS[role]) {
      state.grants[role] = true; state.role = role; state.view = "home"; state.gateRole = null; ui.gateCode = "";
      render();
    } else { ui.gateStatus = "error"; render(); }
  }
  else if (a === "reset") act.reset();
  else if (a === "back") act.goBack();
  else if (a === "dont-know") act.answer(state.encounter.currentQuestion, state.encounter.currentQuestion === "what" ? "" : "unknown");
  else if (a === "continue-what") act.answer("what", state.encounter.answers.presentation.trim());
  else if (a === "prepare") act.prepareReferral();
  else if (a === "one-more") act.continueForOneMore();
  else if (a === "speak") toggleSpeak();
  else if (a === "photo-remove") act.setPhoto(false);
  else if (a.startsWith("ref:")) act.referral(a.slice(4));
  else if (a.startsWith("outcome:")) act.referral("return_outcome", a.slice(8));
});
document.getElementById("phone").addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.input === "gate-code") {
    ui.gateCode = el.value;
    return;
  }
  if (el.dataset && el.dataset.input === "presentation") {
    act.setPresentation(el.value);
    const btn = document.querySelector('[data-act="continue-what"]');
    if (btn) btn.disabled = el.value.trim().length === 0 && !state.encounter.answers.photoAttached;
  }
});
document.getElementById("phone").addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.input === "photo") act.setPhoto(!!(el.files && el.files.length));
  if (el.dataset && el.dataset.failure) act.toggleFailure(el.dataset.failure);
});
window.addEventListener("online", () => { state.online = true; render(); });
window.addEventListener("offline", () => { state.online = false; render(); });

document.documentElement.lang = state.locale;
render();
</script>
